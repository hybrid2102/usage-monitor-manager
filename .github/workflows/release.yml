name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Checks
        run: |
          ruff check .
          ruff format --check .
          pyright
          pytest

      - name: Verify that the tag matches __version__
        shell: pwsh
        run: |
          $version = python -c "import usage_monitor_manager as m; print(m.__version__)"
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tag) {
            Write-Error "tag $tag does not match __version__ $version"
            exit 1
          }
          Write-Host "building $version"

      - name: Build
        run: python build.py --clean --sha

      - name: Smoke test the executable
        shell: pwsh
        run: |
          # UsageMonitorManager.exe is built --noconsole (it is a tray app):
          # PowerShell's own "$var = (& $exe args)" capture does not give a
          # windowed subsystem process a stdout it can actually flush, so use
          # a real CreateProcess-level redirection instead (Start-Process),
          # which the app's own AttachConsole/CONOUT$ fallback does not need
          # to touch at all.
          $exe = (Resolve-Path "dist\UsageMonitorManager.exe").Path
          $outFile = Join-Path $env:RUNNER_TEMP "umm-version.out"
          $errFile = Join-Path $env:RUNNER_TEMP "umm-version.err"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $printed = (Get-Content $outFile -Raw -ErrorAction SilentlyContinue) -join ""
          $stderr = (Get-Content $errFile -Raw -ErrorAction SilentlyContinue) -join ""
          $pe = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "--version: $printed"
          Write-Host "exit code: $($p.ExitCode)"
          if ($stderr) { Write-Host "stderr: $stderr" }
          Write-Host "PE ProductVersion: $pe"
          if ($p.ExitCode -ne 0) { Write-Error "the executable exited with code $($p.ExitCode)"; exit 1 }
          if (-not $printed) { Write-Error "the executable printed no version"; exit 1 }
          if (-not $pe) { Write-Error "the executable carries no PE ProductVersion"; exit 1 }

      - name: Extract the changelog section
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($tag))\]" | Select-Object -First 1).LineNumber
          if (-not $start) {
            "Nessuna sezione di changelog per $tag." | Set-Content notes.md
          } else {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern "^## \[" | Select-Object -First 1).LineNumber
            $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
            $body | Set-Content notes.md -Encoding utf8
          }
          Get-Content notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: UsageMonitorManager
          path: |
            dist/UsageMonitorManager.exe
            dist/UsageMonitorManager.exe.sha256

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/UsageMonitorManager.exe"
          "dist/UsageMonitorManager.exe.sha256"
          --verify-tag
          --title "${{ github.ref_name }}"
          --notes-file notes.md
